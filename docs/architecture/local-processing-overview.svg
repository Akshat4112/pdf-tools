<g font-size="20" font-weight="700" text-anchor="middle"><text x="165" y="101">1. Select files</text><text x="460" y="101">2. Process locally</text><text x="755" y="101">3. Download result</text></g>
<g font-size="14" text-anchor="middle" fill="#475569"><text x="165" y="128">PDFs and images</text><text x="165" y="148">from your device</text><text x="460" y="128">Browser memory</text><text x="460" y="148">PDF libraries and workers</text><text x="755" y="128">New file or archive</text><text x="755" y="148">Originals remain intact</text></g>
