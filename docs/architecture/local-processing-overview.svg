<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="title desc">
<title id="title">Local PDF processing architecture</title><desc id="desc">Select files, process them in the browser, and download results on the device. Static hosting delivers application assets only and may log website requests.</desc>
