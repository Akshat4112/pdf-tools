name: "Bug report"
description: "Report a reproducible problem with synthetic/public-only details."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This is a PUBLIC GitHub issue. **Never share private or work PDFs, real filenames, document content, passwords, personal data, sensitive screenshots, or unredacted logs.** Use only synthetic test examples and generic instructions. For suspected vulnerabilities, do NOT post exploit details publicly; check [GitHub Security](https://github.com/Akshat4112/pdf-tools/security) to see whether private reporting is available.
        Check [Help](https://akshat4112.github.io/pdf-tools/help/) and [Limits](https://akshat4112.github.io/pdf-tools/limitations/) first.
  - type: dropdown
    id: affected-tool
    attributes:
      label: "Affected tool or page"
      options:
        - "Merge PDF"
        - "Split PDF"
        - "Rotate PDF"
        - "Delete pages"
        - "Extract pages"
        - "Organize PDF"
        - "Images to PDF"
        - "PDF to JPG"
        - "PDF to PNG"
        - "PDF reader"
        - "Page numbers"
        - "Text watermark"
        - "PDF to text"
        - "Document information"
        - "Homepage or navigation"
        - "Help, Privacy, Trust or Guides"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "Browser and version"
      placeholder: "Firefox 132 / Chrome 130 / Safari 18"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "Operating system and device type"
      placeholder: "Windows desktop / macOS laptop / Android phone"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Reproduction steps using synthetic data"
      description: "Describe numbered steps with artificial, non-sensitive PDFs only."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What should happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "Quote an error only after confirming it contains no private information."
    validations:
      required: true
  - type: dropdown
    id: synthetic-input
    attributes:
      label: "Test input used"
      options:
        - "No files required"
        - "Synthetic PDF with no personal information"
        - "Synthetic JPG or PNG"
        - "Cannot reproduce without private data (describe steps only)"
    validations:
      required: true
  - type: checkboxes
    id: privacy-check
    attributes:
      label: "Public issue privacy check"
      options:
        - label: "I have not included private files, real document contents, credentials, personal data, or identifying screenshots or logs."
          required: true
        - label: "I am not disclosing unreported security vulnerabilities or exploit details in this public issue."
          required: true
