name: Office synthetic structure and renderer probes

on:
  pull_request:
    paths:
      - 'scripts/generate_office_probes.py'
      - 'scripts/benchmark_office_rendering.py'
      - 'scripts/measure_office_layout.py'
      - 'scripts/test_measure_office_layout.py'
      - '.github/workflows/office-probes.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_office_probes.py'
      - 'scripts/benchmark_office_rendering.py'
      - 'scripts/measure_office_layout.py'
      - 'scripts/test_measure_office_layout.py'
      - '.github/workflows/office-probes.yml'

permissions:
  contents: read

jobs:
  verify-office-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and structurally verify synthetic Office documents
        run: python3 scripts/generate_office_probes.py
      - name: Verify reproducibility and manifest
        run: python3 scripts/generate_office_probes.py --check
      - name: Install independent Office renderer and PDF readback utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils
      - name: Verify text geometry unit tests
        run: python3 -m unittest discover -s scripts -p test_measure_office_layout.py
      - name: Benchmark LibreOffice import and PDF text readback
        run: python3 scripts/benchmark_office_rendering.py
      - name: Upload synthetic corpus and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-synthetic-renderer-probes
          path: fixtures/office/
          retention-days: 7
