name: checks

# PT-FND-008: automated checks for every push/PR to main.
# Stages: install (npm ci, locked) -> lint -> unit tests (vitest, node) ->
# build (tsc + vite) -> corpus validation (dual-reader, python) -> audit gate.
# No document-bearing artifacts are ever uploaded (PT-PD-003 §10).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app checks (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/package.json
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Typecheck tests config
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Design reference contrast and local links
        run: python3 ../scripts/check_design_reference.py

      - name: Install Chromium for page-tool interface checks
        run: npx playwright install --with-deps chromium

      - name: Extract and Delete Pages browser regression checks
        run: npm run test:pages-ui

      - name: JPG and PNG conversion engine browser checks
        run: npm run test:images-engine

      - name: Production dependency audit gate
        run: npm audit --omit=dev --audit-level=high

      # Build output sanity: assets must resolve under /pdf-tools/ (PT-PD-004 §5)
      - name: Verify base path in dist
        run: |
          grep -q '/pdf-tools/assets/' dist/index.html || {
            echo "::error::dist/index.html does not reference /pdf-tools/assets/ (base path broken)"; exit 1; }
          test -f dist/assets/wasm/openjpeg.wasm
          test -f dist/assets/cmaps/78-EUC-H.bcmap
          test -f dist/assets/iccs/CGATS001Compat-v2-micro.icc

  corpus:
    name: fixture corpus validation (two readers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reader dependencies
        run: pip install pymupdf==1.28.0

      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Validate corpus (PyMuPDF + qpdf, per PT-PD-005 §4)
        run: python3 scripts/validate_corpus.py

      # Structural reproducibility: regenerated fixtures must match the committed
      # corpus structurally (same byte sizes, page counts, markers, fields).
      # Byte-identical output is NOT expected — PDF creation IDs/timestamps vary.
      # The committed corpus remains the canonical reference (sha256-pinned).
      - name: Corpus structural reproducibility check
        run: |
          python3 scripts/generate_fixtures.py
          python3 scripts/validate_corpus.py
          python3 scripts/check_reproducibility.py
